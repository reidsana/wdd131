<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form for the WDD 131 assignment.">
  <meta name="author" content="Oksana Reid">
  <title>Product Review</title>
  <link rel="stylesheet" href="styles/form.css">
</head>

<body>

<header>
  <h1>Product Review</h1>
</header>

<main>

  <form method="get" action="review.html">

   
    <label for="productName">Product Name</label>
    <select id="productName" name="productName" required>
      <option value="" disabled selected>Select a Product ...</option>
    </select>

    
    <fieldset class="rating-group">
      <legend>Overall Rating</legend>

      <div class="stars">

        <input type="radio" id="rate1" name="rating" value="1" required>
        <label for="rate1">★☆☆☆☆</label>

        <input type="radio" id="rate2" name="rating" value="2">
        <label for="rate2">★★☆☆☆</label>

        <input type="radio" id="rate3" name="rating" value="3">
        <label for="rate3">★★★☆☆</label>

        <input type="radio" id="rate4" name="rating" value="4">
        <label for="rate4">★★★★☆</label>

        <input type="radio" id="rate5" name="rating" value="5">
        <label for="rate5">★★★★★</label>

      </div>
    </fieldset>

   
    <label for="installDate">Date of Installation</label>
    <input type="date" id="installDate" name="installDate" required>

    
    <fieldset>
      <legend>Which features did you find useful? <span class="small">(Check all that apply)</span></legend>

      <input type="checkbox" id="durability" name="features" value="Durability">
      <label for="durability">Durability</label>

      <input type="checkbox" id="ease" name="features" value="Ease of Use">
      <label for="ease">Ease of Use</label>

      <input type="checkbox" id="performance" name="features" value="Performance">
      <label for="performance">Performance</label>

      <input type="checkbox" id="design" name="features" value="Design">
      <label for="design">Design</label>

    </fieldset>

    
    <label for="reviewText">Written Review (Optional)</label>
    <textarea id="reviewText" name="reviewText" rows="5"></textarea>

    
    <label for="userName">Your Name (Optional)</label>
    <input type="text" id="userName" name="userName">

    
    <input type="submit" class="submit-btn" value="Post Review">

  </form>

</main>

<footer>
  <p>&copy; 2025 • Product Review Form</p>
</footer>

<script src="scripts/products.js" defer></script>

</body>
</html>
