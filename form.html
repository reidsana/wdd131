<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
   <meta name="description" content="Reviewing products for WDD 131 assignment by Oksana Reid.">
    <meta name="author" content="Oksana Reid">
  <link rel="stylesheet" href="css/form.css">
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">

      <!-- PRODUCT NAME -->
      <label for="productName">Product Name</label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Choose a Product ...</option>
      </select>

      <!-- RATING -->
      <fieldset class="rating-group">
        <legend>Overall Rating</legend>

        <div class="stars">
          <label>
            <input type="radio" name="rating" value="1" required>
            ★☆☆☆☆
          </label>

          <label>
            <input type="radio" name="rating" value="2">
            ★★☆☆☆
          </label>

          <label>
            <input type="radio" name="rating" value="3">
            ★★★☆☆
          </label>

          <label>
            <input type="radio" name="rating" value="4">
            ★★★★☆
          </label>

          <label>
            <input type="radio" name="rating" value="5">
            ★★★★★
          </label>
        </div>
      </fieldset>

      <!-- DATE -->
      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- FEATURES -->
      <fieldset>
        <legend>Which features did you find useful in the product?<br><span class="small">(Check all that apply)</span></legend>

        <label><input type="checkbox" name="features" value="Durability"> Durability</label>
        <label><input type="checkbox" name="features" value="Ease of Use"> Ease of Use</label>
        <label><input type="checkbox" name="features" value="Performance"> Performance</label>
        <label><input type="checkbox" name="features" value="Design"> Design</label>

      </fieldset>

     
      <label for="reviewText">Written Review <span class="optional">(Optional)</span></label>
      <textarea id="reviewText" name="reviewText" rows="5"></textarea>


      <label for="userName">Your Name <span class="optional">(Optional)</span></label>
      <input type="text" id="userName" name="userName">

      
      <input class="submit-btn" type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>&copy; 2025 • Product Review Form</p>
  </footer>

  <script src="js/products.js"></script>

</body>
</html>
