<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>Contact | Adventure Trails Hub</title>

  <meta name="description" content="Get in touch with Adventure Trails Hub. Send us a message for questions, feedback, or inquiries about our trails.">
  <meta name="author" content="Oksana Reid">

  <link rel="stylesheet" href="styles/project.css">
  <script src="scripts/project.js" defer></script>
</head>

<body>
<header class="site-header">
  <div class="brand">
    <a class="logo" href="index.html">Adventure Trails Hub</a>
    <button id="nav-toggle" class="nav-toggle"
            aria-controls="primary-nav"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="hamburger"></span>
    </button>
  </div>

  <nav id="primary-nav" class="primary-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="trails.html">Trails</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="references.html">References</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Contact Us</h1>

  <form id="contactForm">
    <label for="name">Name</label>
    <input id="name" name="name" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Send Message</button>
  </form>

  <div id="form-result" aria-live="polite"></div>
</main>

<script>
 
  document.addEventListener('DOMContentLoaded', () => {
    const yearEl = document.querySelectorAll('#year');
    const currentYear = new Date().getFullYear();
    yearEl.forEach(el => el.textContent = currentYear);
  });
</script>

</body>
</html>

  </main>

  <footer>
    <p>&copy; 2025 Oksana Reid. All rights reserved.</p>
    <p><span id="year"></span> Adventure Trails Hub | <a href="references.html">References</a></p>
</footer>
  
</body>
</html>
