<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Oksana Reid">
  <title>Trails | Adventure Trails Hub</title>
  <link rel="stylesheet" href="styles/project.css">
  <script src="scripts/project.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="brand">
    <a class="logo" href="index.html">Adventure Trails Hub</a>
    <button id="nav-toggle" class="nav-toggle"
            aria-controls="primary-nav"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="hamburger"></span>
    </button>
  </div>

  <nav id="primary-nav" class="primary-nav" aria-label="Main Navigation">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="trail.html" class="active" aria-current="page">Trails</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="references.html">References</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Find a Trail</h1>


  <div class="filters">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="all">All</option>
      <option value="easy">Easy</option>
      <option value="moderate">Moderate</option>
      <option value="hard">Hard</option>
    </select>

    <label for="search">Search:</label>
    <input id="search" type="search" placeholder="Search trails…">

    <label for="sort">Sort by:</label>
    <select id="sort">
      <option value="default">Recommended</option>
      <option value="length-asc">Length: Short → Long</option>
      <option value="length-desc">Length: Long → Short</option>
      <option value="difficulty-az">Difficulty (A→Z)</option>
      <option value="name-az">Name (A→Z)</option>
      <option value="name-za">Name (Z→A)</option>
    </select>
  </div>

 
  <h2>All Trails</h2>
  <div class="cards">
    <div class="card">
      <img src="images/trail1.jpg" alt="Ridgeway Loop Trail">
      <h3>Ridgeway Loop</h3>
      <p>Moderate | 5 miles</p>
    </div>
    <div class="card">
      <img src="images/trail2.jpg" alt="Creekside Path Trail">
      <h3>Creekside Path</h3>
      <p>Easy | 2 miles</p>
    </div>
    <div class="card">
      <img src="images/trail3.jpg" alt="Summit Climb Trail">
      <h3>Summit Climb</h3>
      <p>Hard | 7 miles</p>
    </div>
  </div>


  <h2>Your Saved Trails</h2>
  <div id="favorites" class="cards"></div>
</main>

<footer class="site-footer">
  <p>&copy; <span id="year"></span> Adventure Trails Hub | <a href="references.html">References</a></p>
</footer>
</body>
</html>
